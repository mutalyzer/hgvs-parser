[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'mutalyzer-hgvs-parser'
description = 'Mutalyzer HGVS variant description parser.'
version = '0.5.0'

authors = [
    {name = 'LUMC, Mihai Lefter', email = 'M.Lefter@lumc.nl'}]
readme = 'README.rst'
urls = {Homepage = 'https://github.com/mutalyzer/hgvs-parser'}
keywords = ['Mutalyzer', 'HGVS', 'description', 'parser', 'genomic']
license = 'MIT'
classifiers = [
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Typing :: Typed']

requires-python = '>=3.9'
dependencies = ['lark>=1.3.0']

[project.scripts]
mutalyzer_hgvs_parser = 'mutalyzer_hgvs_parser.cli:main'

[tool.setuptools.packages.find]
include = ['mutalyzer_hgvs_parser*']

[tool.setuptools.package-data]
mutalyzer_hgvs_parser = ['py.typed', 'ebnf/*.g']

[project.optional-dependencies]
dev = [
    'coverage',
    'mypy',
    'pytest',
    'ruff']
release = [
    'build>=1.6.1',
    'twine>=7.0.0']
plot = [
    'pydot']
docs = [
    'sphinx',
    'sphinx-argparse']

[tool.ruff]
line-length = 89

[tool.ruff.lint]
select = ['C90', 'E', 'F', 'I', 'W']
ignore = ['E501', 'F401', 'F403']

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
command_line = '-m pytest'

[tool.coverage.report]
omit = ['tests/*']
show_missing = true

[tool.coverage.html]
show_contexts = true
